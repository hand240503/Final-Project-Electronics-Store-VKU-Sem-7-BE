{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 bg-dark text-white" style="min-height: 100vh; padding: 20px 0;">
                <h4 class="ps-3 mb-4">Admin</h4>
                <a href="#" class="d-block text-white text-decoration-none ps-3 py-2">Dashboard</a>
                <a href="#" class="d-block text-white text-decoration-none ps-3 py-2">Sản phẩm</a>
                <a href="#" class="d-block text-white text-decoration-none ps-3 py-2">Danh mục</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10" style="padding: 30px;">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
